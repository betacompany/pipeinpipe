; Replaces Ubuntu's /etc/php/8.5/fpm/pool.d/www.conf. Errors go to nginx's
; per-site error logs, as on the old server.
[www]
user = www-data
group = www-data
listen = /run/php/php8.5-fpm.sock
listen.owner = www-data
listen.group = www-data

; 2 GB RAM, shared with MariaDB
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500
