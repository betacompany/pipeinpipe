# Installed as /etc/nginx/snippets/pipeinpipe-tls.conf; included by the HTTPS
# part of every site (pipeinpipe-<instance>-https.conf, made by provision.sh).
# Mozilla's "intermediate" settings, without the DHE ciphers that need dhparams.

ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:pipeinpipe:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
