# Generated by server/provision.sh for the @NAME@ instance: edit the template
# server/nginx/site.conf, not /etc/nginx/sites-available/pipeinpipe-@NAME@.conf.
# Mirrors the old server's vhosts for @HOST@, m., cupms. and total.
# HTTPS comes from pipeinpipe-@NAME@-https.conf once the instance has a certificate.

server {
	listen 80;
	listen [::]:80;
	include /etc/nginx/snippets/pipeinpipe-@NAME@-https.conf;
	server_name @HOST@;
	access_log /var/log/nginx/@NAME@-pipe.access.log;
	error_log /var/log/nginx/@NAME@-pipe.error.log;
	include /etc/nginx/snippets/pipeinpipe-@NAME@-access.conf;
	include /etc/nginx/snippets/pipeinpipe-common.conf;
	location / {
		root @PIPE_ROOT@/main;
		index index.php;
	}
	include @PIPE_ROOT@/main/.nginxconf;
	location ~ /\. { return 403; }
	location ~ \.php$ {
		include fastcgi_params;
		fastcgi_pass unix:/run/php/php8.5-fpm.sock;
		fastcgi_index index.php;
		fastcgi_param SCRIPT_FILENAME @PIPE_ROOT@/main/$fastcgi_script_name;
		fastcgi_param PATH_INFO $fastcgi_script_name;
	}
	location ~* \.(jpg|jpeg|gif|png|css|zip|tgz|gz|rar|bz2|doc|xls|exe|pdf|ppt|tar|wav|bmp|rtf|swf|ico|flv|txt|xml|docx|xlsx)$ {
		root @PIPE_ROOT@/main;
		access_log off;
		expires 30d;
	}
}

