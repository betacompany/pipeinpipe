# Installed as /etc/nginx/snippets/pipeinpipe-common.conf; included by every site.

# A cold /sport/pipemen renders for ~60 s with no output until the end, right
# at nginx's 60 s default, which would cut the page off
fastcgi_read_timeout 120s;

# Let's Encrypt HTTP-01 challenges (certbot certonly --webroot -w /var/www/letsencrypt)
location ^~ /.well-known/acme-challenge/ {
	auth_basic off;
	root /var/www/letsencrypt;
}
