# Installed as /etc/nginx/sites-available/pipeinpipe-default.conf.
# Requests for unknown hostnames (or the bare IP) get no answer.
server {
	listen 80 default_server;
	listen [::]:80 default_server;
	server_name _;
	return 444;
}

server {
	listen 80;
	listen [::]:80;
	server_name www.pipeinpipe.info;
	return 301 http://pipeinpipe.info$request_uri;
}
