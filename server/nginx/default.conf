# Installed as /etc/nginx/sites-available/pipeinpipe-default.conf.
# Requests for unknown hostnames (or the bare IP) get no answer, over HTTPS no
# certificate either.
server {
	listen 80 default_server;
	listen [::]:80 default_server;
	listen 443 ssl default_server;
	listen [::]:443 ssl default_server;
	ssl_reject_handshake on;
	server_name _;
	return 444;
}

server {
	listen 80;
	listen [::]:80;
	include /etc/nginx/snippets/pipeinpipe-prod-https.conf;
	server_name www.pipeinpipe.info;
	return 301 $scheme://pipeinpipe.info$request_uri;
}
