# Installed as /etc/nginx/conf.d/pipeinpipe-https.conf (http context). Which
# plain-HTTP requests the sites send to HTTPS once they have a certificate (the
# redirect is in pipeinpipe-<instance>-https.conf): all but Let's Encrypt's
# challenges and totalizator's api_proc.php, whose outside caller may not
# follow a redirect.
map "$scheme $request_uri" $pipeinpipe_to_https {
	"~^https "                               0;
	"~^http /\.well-known/acme-challenge/"   0;
	"~^http /api_proc\.php"                  0;
	default                                  1;
}
