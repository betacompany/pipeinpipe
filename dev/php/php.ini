; Shared by the PHP 5.5 and 8.5 containers. Mirrors prod php5-fpm settings,
; except that every error level is logged so the two versions can be compared.

short_open_tag = On
date.timezone = UTC
default_charset = "UTF-8"

memory_limit = 128M
max_execution_time = 30
post_max_size = 8M
upload_max_filesize = 2M
allow_url_fopen = On
expose_php = Off

error_reporting = E_ALL
display_errors = Off
display_startup_errors = Off
html_errors = Off
log_errors = On
error_log = /var/log/php/error.log

; Lets mysql_*/mysqli connect to "localhost" through the socket shared from mariadb
mysql.default_socket = /run/mysqld/mysqld.sock
mysqli.default_socket = /run/mysqld/mysqld.sock
pdo_mysql.default_socket = /run/mysqld/mysqld.sock
