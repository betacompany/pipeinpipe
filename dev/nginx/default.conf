# The server's vhosts (server/nginx/site.conf) for the *.pipeinpipe.localhost
# names on port 8085, with PHP 8.5 in the php85 container.

# As on the server (server/nginx/common.conf): a cold /sport/pipemen renders for
# about 60 s with no output until the end, nginx's default limit
fastcgi_read_timeout 120s;

server {
	listen 8085;
	server_name pipeinpipe.localhost;
	location / {
		root /var/www/pipeinpipe.info/main;
		index index.php;
	}
	include /var/www/pipeinpipe.info/main/.nginxconf;
	# Prebuilt and not in git; fetch-prod-data.sh copies the server's
	location = /css/all.css { alias /srv/assets/all.css; }
	location = /js/all.js { alias /srv/assets/all.js; }
	location ~ /\. { return 403; }
	location ~ \.php$ {
		include /etc/nginx/fastcgi_params;
		fastcgi_pass php85:9000;
		fastcgi_index index.php;
		fastcgi_param SCRIPT_FILENAME /var/www/pipeinpipe.info/main/$fastcgi_script_name;
		fastcgi_param PATH_INFO $fastcgi_script_name;
	}
	location ~* \.(jpg|jpeg|gif|png|css|zip|tgz|gz|rar|bz2|doc|xls|exe|pdf|ppt|tar|wav|bmp|rtf|swf|ico|flv|txt|xml|docx|xlsx)$ {
		root /var/www/pipeinpipe.info/main;
		access_log off;
	}
}

