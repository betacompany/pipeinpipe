# Mirror of the prod vhosts in ~/pipeinpipe.info.conf.d on the server.
# Every site listens on both ports; the port picks the PHP version.

upstream php85 { server php85:9000; }
upstream php55 { server php55:9000; }

map $server_port $php_backend {
	8055    php55;
	default php85;
}

# Prod keeps nginx's 60 s default. Here the emulated PHP 5.5 and a freshly
# imported (cold) DB can be slower than that, and nginx would cut pages short.
fastcgi_read_timeout 300s;

server {
	listen 8085;
	listen 8055;
	server_name pipeinpipe.localhost;
	location / {
		root /var/www/pipeinpipe.info/main;
		index index.php;
	}
	include /var/www/pipeinpipe.info/main/.nginxconf;
	# Built on the server by deploy.sh and not in git; copied by fetch-prod-data.sh
	location = /css/all.css { alias /srv/assets/all.css; }
	location = /js/all.js { alias /srv/assets/all.js; }
	location ~ /\. { return 403; }
	location ~ \.php$ {
		include /etc/nginx/fastcgi_params;
		fastcgi_pass $php_backend;
		fastcgi_index index.php;
		fastcgi_param SCRIPT_FILENAME /var/www/pipeinpipe.info/main/$fastcgi_script_name;
		fastcgi_param PATH_INFO $fastcgi_script_name;
	}
	location ~* \.(jpg|jpeg|gif|png|css|zip|tgz|gz|rar|bz2|doc|xls|exe|pdf|ppt|tar|wav|bmp|rtf|swf|ico|flv|txt|xml|docx|xlsx)$ {
		root /var/www/pipeinpipe.info/main;
		access_log off;
	}
}

